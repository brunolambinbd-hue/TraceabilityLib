name: CI Tests & JaCoCo Coverage Report

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-coverage:
    name: Run Unit & Instrumented Tests + JaCoCo Report
    runs-on: macos-13

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: 🧪 Step 1 - Run JVM Unit Tests
        run: ./gradlew :library:testDebugUnitTest

      - name: 📱 Step 2 - Run Instrumented Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :library:connectedCheck --continue

      - name: 📊 Step 3 - Generate Combined JaCoCo Coverage Report
        run: ./gradlew :library:jacocoTestReport

      - name: 📂 Upload JaCoCo HTML Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: library/build/reports/jacoco/jacocoTestReport/html/

      - name: 📂 Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: library/build/reports/tests/
