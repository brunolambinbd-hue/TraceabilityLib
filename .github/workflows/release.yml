name: Build, Release & Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build, Test & Publish to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :library:testDebugUnitTest

      - name: Build Android Library Release
        run: ./gradlew :library:assembleRelease

      - name: Publish Package to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :library:publishReleasePublicationToGitHubPackagesRepository

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 🛡️ TraceabilityLib ${{ github.ref_name }}
            
            - Dual-Channel Observability API (`LogManager`, `BreadcrumbManager`, `TraceConstants`, `TdoAssertions`, `LogManagerExt`).
            - Full KDoc documentation and 100% test coverage.
            - Artifact published to GitHub Packages (`com.parabd.lib:traceability:${{ github.ref_name }}`).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
