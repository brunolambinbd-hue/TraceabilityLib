[versions]
agp = "8.8.2"
kotlin = "2.0.21"

# SDK Versions
sdkMin = "21"
sdkCompile = "35"

# Java/Kotlin JVM Versions
javaVersion = "18"

ksp = "2.0.21-1.0.28"
coreKtx = "1.13.1"
appcompat = "1.7.1"
material = "1.13.0"
playServicesMlkitTextRecognition = "19.0.1"
room = "2.6.1"
activityKtx = "1.8.2"
coreSplashscreen = "1.2.0"
coil = "2.7.0"
download = "5.6.0"
work = "2.9.0"
imageCropper = "4.6.0"
arcore = "1.47.0"
truth = "1.4.2"
sonar = "5.1.0.4882"
dokka = "1.9.20"

# Nouvelle version pour MediaPipe
mediaPipe = "0.10.29"

# Versions pour les tests
junit = "4.13.2"
junitExt = "1.3.0"
espressoCore = "3.7.0"
archCoreTesting = "2.2.0"
lifecycleTesting = "2.10.0"
mockito = "5.2.1"
mockitoInline = "5.2.0"
mockito-android = "5.12.0"
coroutinesTest = "1.9.0"
robolectric = "4.14.1"
uiautomator = "2.3.0"
roomTesting = "2.6.1"
json = "20231013"
junitVersion = "4.12"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }

androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

# Correction du nom de la librairie
image-cropper = { group = "com.vanniktech", name = "android-image-cropper", version.ref = "imageCropper" }

# Nouvelle librairie MediaPipe
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediaPipe" }

# Librairies de Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-espresso-contrib = { group = "androidx.test.espresso", name = "espresso-contrib", version.ref = "espressoCore" }
androidx-espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "espressoCore" }
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "roomTesting" }

# Correction de l'artefact de test pour le Lifecycle
androidx-lifecycle-testing = { group = "androidx.lifecycle", name = "lifecycle-runtime-testing", version.ref = "lifecycleTesting" }

mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito" }
mockito-inline = { group = "org.mockito", name = "mockito-inline", version.ref = "mockitoInline" }
mockito-android = { group = "org.mockito", name = "mockito-android", version.ref = "mockito-android" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesTest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
play-services-mlkit-text-recognition = { module = "com.google.android.gms:play-services-mlkit-text-recognition", version.ref = "playServicesMlkitTextRecognition" }
arcore = { group = "com.google.ar", name = "core", version.ref = "arcore" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
json = { group = "org.json", name = "json", version.ref = "json" }
junit-junit = { group = "junit", name = "junit", version.ref = "junitVersion" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-library = { id = "com.android.library", version.ref = "agp" }
sonarqube = { id = "org.sonarqube", version.ref = "sonar" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
download = { id = "de.undercouch.download", version.ref = "download" }
